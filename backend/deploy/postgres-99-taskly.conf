# Tuning Postgres untuk VM Lightsail 442 MB RAM.
# Mesin ini dipakai bareng: Postgres + Node API + nginx.
# Default Debian (shared_buffers 128MB, max_connections 100) terlalu besar
# dan bikin OOM killer jalan begitu ada beberapa koneksi bersamaan.

listen_addresses = 'localhost'
port = 5432

max_connections = 25
shared_buffers = 80MB
effective_cache_size = 200MB

# work_mem kecil karena query aplikasi ini sederhana (filter + sort tugas),
# tidak ada JOIN besar atau sorting data banyak.
work_mem = 2MB
maintenance_work_mem = 24MB
wal_buffers = 4MB

min_wal_size = 48MB
max_wal_size = 192MB
checkpoint_completion_target = 0.9

# SSD: random read jauh lebih murah dari default 4.0
random_page_cost = 1.1
effective_io_concurrency = 200

timezone = 'Asia/Jakarta'

# Catat query yang lambat supaya mudah ditelusuri saat demo.
log_min_duration_statement = 800
