# nginx untuk Taskly: satu origin, tanpa CORS.
#   /       -> file statis hasil `flutter build web`
#   /api/   -> reverse proxy ke Node di 127.0.0.1:3000
#
# Pasang di /etc/nginx/sites-available/taskly lalu symlink ke sites-enabled.
#
# TLS memakai sertifikat Let's Encrypt untuk IP publik (profil shortlived,
# berlaku 6 hari, diperbarui otomatis oleh timer certbot).
# Catatan: nama file sertifikat mengikuti IP server. Kalau IP berubah,
# sertifikat harus diminta ulang.

# --- HTTP: hanya untuk redirect ke HTTPS dan verifikasi renewal certbot ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Jangan bocorkan versi nginx.
    server_tokens off;

    # certbot --standalone butuh port 80; selama renewal, nginx dihentikan
    # sebentar oleh hook, jadi blok ini cukup untuk melayani redirect biasa.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/16.78.104.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16.78.104.237/privkey.pem;

    # Setelan TLS ditulis eksplisit (bukan include bawaan certbot) karena
    # plugin nginx certbot tidak dipakai — sertifikat diminta lewat --standalone.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/taskly;
    index index.html;

    server_tokens off;

    # Body request kecil saja: aplikasi ini hanya kirim JSON pendek.
    client_max_body_size 2m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Flutter web -------------------------------------------------------
    # Hasil build Flutter: index.html + flutter_bootstrap.js + main.dart.js.
    # Asset ber-hash boleh di-cache lama; index.html jangan, biar update
    # langsung kepakai.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|wasm|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Flutter web memakai client-side routing; request yang tidak cocok file
    # mana pun harus jatuh ke index.html, bukan 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}
